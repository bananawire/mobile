# .github/workflows/patrol-e2e.yml
#
# Continuous Integration for the Clair mobile app (Flutter + Patrol).
# Boots an Android emulator and runs every `patrolTest` declared in
# `patrol_test/` against the real backend at `CLAIR_BACKEND_BASE_URL`.
#
# Triggered by: push to any branch, every pull_request, and manual runs.
#
# Required GitHub Actions secret:
#   * `CLAIR_BACKEND_BASE_URL` — URL of the staging deployment of
#     clair-core. Without a reachable backend, the 15 API-touching
#     tests fail (the demo test + the bootstrap do not).

name: Build and Test - Continuous Integration

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-mobile-tests:
    name: Build and Run Test Suites
    runs-on: ubuntu-24.04

    env:
      CLAIR_BACKEND_BASE_URL: ${{ secrets.CLAIR_BACKEND_BASE_URL }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17 (for Gradle / Android build)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (patrol_test/)
        run: flutter analyze patrol_test/

      - name: Materialise .env
        run: echo "CLAIR_BACKEND_BASE_URL=$CLAIR_BACKEND_BASE_URL" > .env

      - name: Activate Patrol CLI
        run: dart pub global activate patrol_cli 2>&1 | tail -5

      - name: Add Dart pub-global bin to PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Boot Android emulator (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell getprop sys.boot_completed
            echo "Emulator ready."

      - name: Build and Test
        run: |
          set -o pipefail
          patrol test --device emulator-5554 --generate-bundle \
            2>&1 | tee patrol-output.log
          rc=${PIPESTATUS[0]}
          echo "patrol exit code: $rc"
          exit $rc

      - name: Upload Patrol report (HTML + JUnit + log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-report
          path: |
            build/app/reports/androidTests/connected/debug/
            patrol-output.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug APK for local repro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: warn